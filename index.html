<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KR Bet</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #111118;
            --gold: #c9a84c;
            --gold-light: #e0c878;
            --text: #e0e0e0;
            --text-dim: #888;
            --danger: #e74c3c;
            --success: #2ecc71;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }
        #stars-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.5; }
        #loading-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; transition: opacity 0.5s ease, visibility 0.5s; }
        #loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .loading-logo { font-size: 2rem; font-weight: 700; letter-spacing: 6px; color: var(--gold); margin-bottom: 24px; text-transform: uppercase; }
        .loading-bar-track { width: 180px; height: 2px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
        .loading-bar-fill { height: 100%; width: 0%; background: var(--gold); transition: width 0.15s linear; }
        #app { display: none; flex-direction: column; width: 100%; height: 100%; max-width: 480px; background: transparent; position: relative; z-index: 1; }
        #app.active { display: flex; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid rgba(255,255,255,0.04); z-index: 10; flex-shrink: 0; }
        .header-logo { font-size: 1.1rem; font-weight: 700; letter-spacing: 3px; color: var(--gold); }
        .balance-wrap { display: flex; align-items: center; gap: 10px; }
        .balance-badge { display: flex; align-items: center; gap: 5px; background: rgba(201,168,76,0.08); padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; color: var(--gold-light); }
        .btn-add { width: 28px; height: 28px; border-radius: 6px; background: transparent; border: 1px solid var(--gold); color: var(--gold); font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; background: transparent; }
        .tab-pane { display: none; flex-direction: column; align-items: center; padding: 12px; min-height: 100%; }
        .tab-pane.active { display: flex; }

        /* Roll */
        .bank-display { font-size: 0.85rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
        .bank-amount { font-size: 1.4rem; font-weight: 700; color: var(--gold-light); margin-bottom: 8px; }
        .roulette-container { position: relative; width: 290px; height: 290px; margin: 0 auto 10px; }
        .roulette-outer { width: 270px; height: 270px; border-radius: 50%; border: 3px solid #1a1a25; background: #0d0d18; position: absolute; top: 10px; left: 10px; box-shadow: 0 0 60px rgba(0,0,0,0.6), inset 0 0 30px rgba(0,0,0,0.8); overflow: hidden; }
        .roulette-wheel { width: 100%; height: 100%; border-radius: 50%; position: relative; }
        .roulette-wheel canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; }
        .roulette-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #2a2a35, #0a0a0f); border: 2px solid #1a1a25; z-index: 5; }
        .pointer-layer { position: absolute; top: 10px; left: 10px; width: 270px; height: 270px; pointer-events: none; z-index: 10; }
        .pointer-arrow { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 18px solid var(--gold); filter: drop-shadow(0 0 8px rgba(201,168,76,0.9)); }
        .timer-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 2.2rem; font-weight: 800; color: var(--gold); z-index: 6; text-shadow: 0 0 20px rgba(201,168,76,0.6); pointer-events: none; letter-spacing: 2px; }
        .bet-controls { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
        .bet-input { width: 75px; padding: 9px 7px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: var(--surface); color: white; font-size: 0.9rem; text-align: center; outline: none; font-weight: 600; }
        .bet-input:focus { border-color: var(--gold); }
        .btn-bet { padding: 9px 18px; background: var(--gold); border: none; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer; color: #0a0a0f; text-transform: uppercase; letter-spacing: 1px; }
        .btn-bet:disabled { opacity: 0.35; pointer-events: none; }
        .my-bet-info { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 2px; }
        .players-list { width: 100%; max-width: 320px; margin-top: 6px; max-height: 120px; overflow-y: auto; }
        .player-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.8rem; color: #bbb; }
        .player-row.you { color: var(--gold-light); font-weight: 600; }
        .player-row.cashed { color: var(--success); }
        .player-row.crashed { color: var(--danger); }
        .player-color-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; }

        /* Crash */
        .crash-display { width: 90%; max-width: 340px; aspect-ratio: 1; background: var(--surface); border-radius: 16px; border: 2px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; position: relative; margin: 12px auto; overflow: hidden; min-width: 260px; min-height: 260px; }
        .crash-grid-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 10% 10%; }
        .crash-graph-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .crash-multiplier { font-size: 4rem; font-weight: 800; letter-spacing: 2px; transition: color 0.3s; z-index: 2; }
        .crash-multiplier.crashed { color: var(--danger); }
        .crash-history { display: flex; gap: 5px; overflow-x: auto; width: 90%; max-width: 340px; padding: 6px 0; margin: 0 auto 8px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .crash-history::-webkit-scrollbar { display: none; }
        .history-item { flex-shrink: 0; padding: 5px 10px; border-radius: 5px; font-weight: 700; font-size: 0.8rem; min-width: 50px; text-align: center; background: #1a1a25; color: #aaa; }
        .history-item.green { background: rgba(46,204,113,0.15); color: var(--success); }
        .history-item.red { background: rgba(231,76,60,0.15); color: var(--danger); }
        .crash-btn { width: 90%; max-width: 340px; padding: 16px; border: none; border-radius: 12px; font-weight: 800; font-size: 1.1rem; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: all 0.2s; margin: 8px auto; display: block; }
        .crash-btn.place { background: var(--gold); color: #0a0a0f; }
        .crash-btn.waiting { background: #1a1a25; color: #666; pointer-events: none; }
        .crash-btn.cashout { background: var(--success); color: white; animation: pulse-btn 0.7s ease-in-out infinite; }
        .crash-btn.crashed { background: var(--danger); color: white; pointer-events: none; }
        @keyframes pulse-btn { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }

        /* Mines */
        .mines-settings { display: flex; gap: 10px; align-items: center; margin: 12px 0; flex-wrap: wrap; justify-content: center; }
        .mines-settings label { font-size: 0.85rem; color: var(--text-dim); }
        .mines-settings select { padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: var(--surface); color: white; font-size: 0.9rem; outline: none; font-weight: 600; }
        .mines-settings select:focus { border-color: var(--gold); }
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 90%; max-width: 300px; margin: 8px auto; }
        .mines-cell { aspect-ratio: 1; border-radius: 8px; background: var(--surface); border: 1px solid rgba(255,255,255,0.06); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; transition: all 0.2s; }
        .mines-cell:active { transform: scale(0.93); }
        .mines-cell.revealed { background: #1a2a1a; border-color: rgba(46,204,113,0.3); }
        .mines-cell.bomb { background: #2a1a1a; border-color: rgba(231,76,60,0.3); }
        .mines-cell.disabled { pointer-events: none; }
        .mines-info { display: flex; gap: 20px; align-items: center; margin: 8px 0; font-size: 0.9rem; }
        .mines-multiplier { font-size: 1.6rem; font-weight: 800; color: var(--gold-light); }
        .mines-multiplier.cashed { color: var(--success); }
        .mines-multiplier.lost { color: var(--danger); }
        .mines-btn { width: 90%; max-width: 300px; padding: 14px; border: none; border-radius: 12px; font-weight: 800; font-size: 1rem; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; margin: 8px auto; display: block; transition: all 0.2s; }
        .mines-btn.start { background: var(--gold); color: #0a0a0f; }
        .mines-btn.cashout { background: var(--success); color: white; animation: pulse-btn 0.7s ease-in-out infinite; }
        .mines-btn.over { background: #1a1a25; color: #666; pointer-events: none; }

        /* Bet modals */
        .bet-modal { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid rgba(255,255,255,0.06); padding: 24px 20px 30px; border-radius: 20px 20px 0 0; z-index: 150; display: flex; flex-direction: column; gap: 16px; max-width: 480px; margin: 0 auto; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; }
        .bet-modal.show { transform: translateY(0); pointer-events: auto; }
        .bet-modal input { padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: var(--bg); color: white; font-size: 1.2rem; text-align: center; outline: none; font-weight: 700; }
        .bet-modal .quick-bets { display: flex; gap: 8px; }
        .bet-modal .quick-bets button { flex: 1; padding: 14px 0; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: var(--bg); color: white; cursor: pointer; font-weight: 700; font-size: 1rem; }
        .bet-modal .quick-bets button:active { background: var(--gold); color: #0a0a0f; }
        .bet-modal .modal-actions { display: flex; gap: 10px; }
        .bet-modal .modal-actions button { flex: 1; padding: 16px; border-radius: 12px; border: none; font-weight: 700; font-size: 1rem; cursor: pointer; }
        .bet-modal .btn-confirm { background: var(--gold); color: #0a0a0f; }
        .bet-modal .btn-cancel { background: transparent; border: 1px solid #444; color: #aaa; }

        .mines-bet-modal { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid rgba(255,255,255,0.06); padding: 24px 20px 30px; border-radius: 20px 20px 0 0; z-index: 150; display: flex; flex-direction: column; gap: 16px; max-width: 480px; margin: 0 auto; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; }
        .mines-bet-modal.show { transform: translateY(0); pointer-events: auto; }
        .mines-bet-modal input { padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: var(--bg); color: white; font-size: 1.2rem; text-align: center; outline: none; font-weight: 700; }
        .mines-bet-modal .quick-bets { display: flex; gap: 8px; }
        .mines-bet-modal .quick-bets button { flex: 1; padding: 14px 0; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: var(--bg); color: white; cursor: pointer; font-weight: 700; font-size: 1rem; }
        .mines-bet-modal .quick-bets button:active { background: var(--gold); color: #0a0a0f; }
        .mines-bet-modal .modal-actions { display: flex; gap: 10px; }
        .mines-bet-modal .modal-actions button { flex: 1; padding: 16px; border-radius: 12px; border: none; font-weight: 700; font-size: 1rem; cursor: pointer; }
        .mines-bet-modal .btn-confirm { background: var(--gold); color: #0a0a0f; }
        .mines-bet-modal .btn-cancel { background: transparent; border: 1px solid #444; color: #aaa; }

        .bottom-tabs { display: flex; border-top: 1px solid rgba(255,255,255,0.05); background: var(--surface); flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
        .bottom-tabs::-webkit-scrollbar { display: none; }
        .bottom-tab { flex: 1; padding: 14px 10px; background: transparent; color: #666; border: none; font-size: 0.8rem; font-weight: 600; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; transition: color 0.2s; white-space: nowrap; }
        .bottom-tab.active { color: var(--gold); }
        .profile-card { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 30px; }
        .profile-avatar { width: 72px; height: 72px; border-radius: 50%; border: 2px solid var(--gold); background: #1a1a25; }
        .profile-nick { font-size: 1.2rem; font-weight: 600; }
        .stats-row { display: flex; gap: 32px; margin-top: 20px; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 1.4rem; font-weight: 700; color: var(--gold-light); }
        .stat-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

        /* Balance modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; display: none; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal { background: var(--surface); border-radius: 12px; padding: 24px; width: 85%; max-width: 340px; border: 1px solid rgba(255,255,255,0.06); text-align: center; }
        .modal h3 { margin-bottom: 16px; color: var(--gold); font-weight: 600; }
        .modal-input-row { display: flex; gap: 8px; align-items: center; justify-content: center; margin-bottom: 10px; }
        .modal-input { width: 120px; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15); background: #0a0a0f; color: white; font-size: 0.95rem; text-align: center; outline: none; font-weight: 600; }
        .modal-input:focus { border-color: var(--gold); }
        .modal button { margin: 5px; padding: 10px 20px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .btn-deposit { background: var(--gold); color: #0a0a0f; }
        .btn-withdraw { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
        .btn-close-modal { background: #222; color: #aaa; margin-top: 8px; }
        .withdraw-note { font-size: 0.7rem; color: #666; margin-top: 8px; }

        /* Notification */
        .notification-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 300; display: none; align-items: center; justify-content: center; }
        .notification-overlay.show { display: flex; }
        .notification-modal { background: var(--surface); border-radius: 14px; padding: 28px 24px; width: 80%; max-width: 320px; border: 1px solid var(--gold); text-align: center; box-shadow: 0 0 40px rgba(201,168,76,0.15); }
        .notification-modal .notif-icon { font-size: 2.5rem; margin-bottom: 12px; }
        .notification-modal .notif-text { font-size: 0.95rem; color: var(--text); margin-bottom: 20px; line-height: 1.5; font-weight: 500; }
        .notification-modal .notif-btn { padding: 12px 32px; background: var(--gold); color: #0a0a0f; border: none; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }

        .result-banner { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1a1a25; border: 1px solid var(--gold); color: var(--gold-light); padding: 12px 24px; border-radius: 8px; font-weight: 700; z-index: 150; text-align: center; pointer-events: none; }
        @keyframes fadeInOut { 0% { opacity: 0; top: 0; } 15% { opacity: 1; top: 20px; } 75% { opacity: 1; top: 20px; } 100% { opacity: 0; top: 0; } }
    </style>
</head>
<body>

<canvas id="stars-canvas"></canvas>

<div id="loading-screen">
    <div class="loading-logo">KR Bet</div>
    <div class="loading-bar-track"><div class="loading-bar-fill" id="loading-fill"></div></div>
</div>

<div id="app">
    <div class="header">
        <span class="header-logo">KR Bet</span>
        <div class="balance-wrap">
            <span class="balance-badge">⭐ <span id="balance-display">0</span></span>
            <button class="btn-add" id="btn-open-modal">+</button>
        </div>
    </div>

    <div class="content">
        <div class="tab-pane" id="tab-roll">
            <div class="bank-display">Банк</div>
            <div class="bank-amount" id="bank-amount">0 ⭐</div>
            <div class="roulette-container">
                <div class="pointer-layer" id="pointer-layer"><div class="pointer-arrow"></div></div>
                <div class="roulette-outer">
                    <div class="roulette-wheel" id="roulette-wheel"><canvas id="wheel-canvas"></canvas></div>
                    <div class="roulette-center"></div>
                    <div class="timer-overlay" id="timer-overlay">30</div>
                </div>
            </div>
            <div class="my-bet-info" id="my-bet-info">Ваша ставка: —</div>
            <div class="bet-controls">
                <input type="number" class="bet-input" id="bet-input" value="10" min="10">
                <button class="btn-bet" id="btn-place-bet">Поставить</button>
            </div>
            <div class="players-list" id="players-list"></div>
        </div>

        <div class="tab-pane active" id="tab-crash">
            <div class="crash-display" id="crash-display">
                <div class="crash-grid-bg"></div>
                <canvas class="crash-graph-canvas" id="crash-graph-canvas"></canvas>
                <div class="crash-multiplier" id="crash-multiplier">1.00x</div>
            </div>
            <div class="crash-history" id="crash-history"></div>
            <button class="crash-btn place" id="crash-main-btn">Place Bet</button>
            <div class="players-list" id="crash-players-list"></div>
        </div>

        <div class="tab-pane" id="tab-mines">
            <div class="mines-settings">
                <label>Мины:</label>
                <select id="mines-count">
                    <option value="1">1</option><option value="2">2</option><option value="3" selected>3</option>
                    <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                    <option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
                </select>
            </div>
            <div class="mines-info">
                <span>Множитель: <span class="mines-multiplier" id="mines-multiplier">1.00x</span></span>
                <span>Открыто: <span id="mines-revealed">0</span></span>
            </div>
            <div class="mines-grid" id="mines-grid"></div>
            <button class="mines-btn start" id="mines-main-btn">Играть</button>
        </div>

        <div class="tab-pane" id="tab-profile">
            <div class="profile-card">
                <img class="profile-avatar" id="profile-avatar" src="https://api.dicebear.com/9.x/thumbs/svg?seed=player1" alt="Avatar">
                <div class="profile-nick" id="profile-nick">Player</div>
                <div class="stats-row">
                    <div class="stat-item"><div class="stat-value" id="stat-wins">0</div><div class="stat-label">Побед</div></div>
                    <div class="stat-item"><div class="stat-value" id="stat-spent">0</div><div class="stat-label">Потрачено</div></div>
                    <div class="stat-item"><div class="stat-value" id="stat-won">0</div><div class="stat-label">Выиграно</div></div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-tabs">
        <button class="bottom-tab" data-tab="roll">Roll</button>
        <button class="bottom-tab active" data-tab="crash">Crash</button>
        <button class="bottom-tab" data-tab="mines">Mines</button>
        <button class="bottom-tab" data-tab="profile">Profile</button>
    </div>
</div>

<!-- Crash Bet Modal -->
<div class="bet-modal" id="bet-modal">
    <input type="number" id="crash-bet-input" placeholder="Сумма ставки" value="10" min="10">
    <div class="quick-bets">
        <button onclick="document.getElementById('crash-bet-input').value='10'">10</button>
        <button onclick="document.getElementById('crash-bet-input').value='50'">50</button>
        <button onclick="document.getElementById('crash-bet-input').value='100'">100</button>
        <button onclick="document.getElementById('crash-bet-input').value='500'">500</button>
    </div>
    <div class="modal-actions">
        <button class="btn-cancel" id="btn-cancel-bet">Отмена</button>
        <button class="btn-confirm" id="btn-confirm-bet">Поставить</button>
    </div>
</div>

<!-- Mines Bet Modal -->
<div class="mines-bet-modal" id="mines-bet-modal">
    <input type="number" id="mines-bet-input" placeholder="Сумма ставки" value="10" min="10">
    <div class="quick-bets">
        <button onclick="document.getElementById('mines-bet-input').value='10'">10</button>
        <button onclick="document.getElementById('mines-bet-input').value='50'">50</button>
        <button onclick="document.getElementById('mines-bet-input').value='100'">100</button>
        <button onclick="document.getElementById('mines-bet-input').value='500'">500</button>
    </div>
    <div class="modal-actions">
        <button class="btn-cancel" id="btn-cancel-mines-bet">Отмена</button>
        <button class="btn-confirm" id="btn-confirm-mines-bet">Играть</button>
    </div>
</div>

<!-- Balance Modal -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <h3>Баланс: ⭐ <span id="modal-balance">0</span></h3>
        <div class="modal-input-row"><input type="number" class="modal-input" id="modal-amount-input" placeholder="Сумма" value="10" min="1"></div>
        <button class="btn-deposit" id="btn-deposit">Пополнить</button>
        <button class="btn-withdraw" id="btn-withdraw">Вывести</button><br>
        <button class="btn-close-modal" id="btn-close-modal">Закрыть</button>
        <div class="withdraw-note">Пополнение через Telegram Stars</div>
    </div>
</div>

<!-- Notification -->
<div class="notification-overlay" id="notification-overlay">
    <div class="notification-modal">
        <div class="notif-icon" id="notif-icon">⚠️</div>
        <div class="notif-text" id="notif-text"></div>
        <button class="notif-btn" id="notif-btn">OK</button>
    </div>
</div>

<div id="result-banner" class="result-banner" style="display:none;"></div>

<script>
(function() {
    // ============ TELEGRAM MINI APP ============
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#0a0a0f');
        tg.setBackgroundColor('#0a0a0f');
    }

    const API_URL = 'https://krbet.onrender.com/api';

    // Данные пользователя
    let userInfo = { id: null, username: null, firstName: null, photoUrl: null };
    if (tg?.initDataUnsafe?.user) {
        userInfo.id = tg.initDataUnsafe.user.id;
        userInfo.username = tg.initDataUnsafe.user.username;
        userInfo.firstName = tg.initDataUnsafe.user.first_name;
        userInfo.photoUrl = tg.initDataUnsafe.user.photo_url;
    } else {
        userInfo.id = 0;
        userInfo.username = 'Player';
        userInfo.firstName = 'Player';
    }

    // ============ ЗВЁЗДНЫЙ ФОН ============
    const starsCanvas = document.getElementById('stars-canvas');
    const starsCtx = starsCanvas.getContext('2d');
    let stars = [];
    const STAR_COUNT = 60;
    function resizeStars() { starsCanvas.width = window.innerWidth; starsCanvas.height = window.innerHeight; }
    function createStars() {
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: Math.random() * starsCanvas.width, y: Math.random() * starsCanvas.height,
                z: Math.random() * 0.8 + 0.2, size: Math.random() * 1.5 + 0.5,
                twinkleSpeed: Math.random() * 0.02 + 0.005, twinkleOffset: Math.random() * Math.PI * 2,
            });
        }
    }
    function animateStars() {
        starsCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
        const cx = starsCanvas.width / 2, cy = starsCanvas.height / 2;
        stars.forEach(star => {
            const dx = star.x - cx, dy = star.y - cy;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const speed = star.z * 0.3;
            if (dist > 0) { star.x += (dx / dist) * speed; star.y += (dy / dist) * speed; }
            if (star.x < -20 || star.x > starsCanvas.width + 20 || star.y < -20 || star.y > starsCanvas.height + 20) {
                star.x = cx + (Math.random() - 0.5) * 60; star.y = cy + (Math.random() - 0.5) * 60; star.z = Math.random() * 0.8 + 0.2;
            }
            const alpha = 0.3 + Math.sin(Date.now() * star.twinkleSpeed + star.twinkleOffset) * 0.3;
            starsCtx.beginPath(); starsCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            starsCtx.fillStyle = `rgba(255,255,255,${Math.max(0.1, alpha)})`; starsCtx.fill();
        });
        requestAnimationFrame(animateStars);
    }
    resizeStars(); createStars(); animateStars();
    window.addEventListener('resize', () => { resizeStars(); createStars(); });

    // ============ СОСТОЯНИЕ ============
    let balance = 0;
    let stats = { wins: 0, spent: 0, won: 0 };

    // Roll
    let timerSeconds=30,timerInterval=null,gamePhase='waiting',myBet=0,allBets=[];
    const uniqueColorsPool=['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#e91e63','#00bcd4','#ff5722','#8bc34a','#3f51b5','#ff9800','#795548','#607d8b'];
    let usedColors=[],currentPointerAngle=0;

    // Crash
    let crashPhase='betting',crashMultiplier=1.00,crashMaxMultiplier=1.00;
    let crashInterval=null,crashCountdown=5,crashCountdownInterval=null;
    let crashMyBet=0,crashMyCashedOut=false,crashHistory=[];
    let graphPoints=[];

    // Mines
    let minesGameActive=false,minesBet=0,minesMineCount=3,minesRevealed=0;
    let minesGrid=[],minesPositions=[];

    // DOM
    const loadingScreen=document.getElementById('loading-screen'),loadingFill=document.getElementById('loading-fill');
    const app=document.getElementById('app'),balanceDisplay=document.getElementById('balance-display'),modalBalance=document.getElementById('modal-balance'),resultBanner=document.getElementById('result-banner');
    const bankAmount=document.getElementById('bank-amount'),timerOverlay=document.getElementById('timer-overlay');
    const canvas=document.getElementById('wheel-canvas'),ctx=canvas.getContext('2d');
    const SCALE=2,DISPLAY=270,SIZE=DISPLAY*SCALE;canvas.width=SIZE;canvas.height=SIZE;
    const pointerLayer=document.getElementById('pointer-layer'),myBetInfo=document.getElementById('my-bet-info');
    const betInput=document.getElementById('bet-input'),btnPlaceBet=document.getElementById('btn-place-bet'),playersList=document.getElementById('players-list');
    const crashDisplay=document.getElementById('crash-display');
    const crashMultiplierEl=document.getElementById('crash-multiplier'),crashHistoryEl=document.getElementById('crash-history');
    const crashMainBtn=document.getElementById('crash-main-btn'),crashPlayersList=document.getElementById('crash-players-list');
    const betModal=document.getElementById('bet-modal'),crashBetInput=document.getElementById('crash-bet-input');
    const btnConfirmBet=document.getElementById('btn-confirm-bet'),btnCancelBet=document.getElementById('btn-cancel-bet');
    const graphCanvas=document.getElementById('crash-graph-canvas'),graphCtx=graphCanvas.getContext('2d');
    const minesGridEl=document.getElementById('mines-grid'),minesCountSelect=document.getElementById('mines-count');
    const minesMultiplierEl=document.getElementById('mines-multiplier'),minesRevealedEl=document.getElementById('mines-revealed');
    const minesMainBtn=document.getElementById('mines-main-btn');
    const minesBetModal=document.getElementById('mines-bet-modal'),minesBetInput=document.getElementById('mines-bet-input');
    const btnConfirmMinesBet=document.getElementById('btn-confirm-mines-bet'),btnCancelMinesBet=document.getElementById('btn-cancel-mines-bet');
    const statWins=document.getElementById('stat-wins'),statSpent=document.getElementById('stat-spent'),statWon=document.getElementById('stat-won');

    // Notification
    const notificationOverlay=document.getElementById('notification-overlay');
    const notifIcon=document.getElementById('notif-icon');
    const notifText=document.getElementById('notif-text');
    const notifBtn=document.getElementById('notif-btn');

    function showNotification(text, type) {
        notifIcon.textContent = type === 'error' ? '⚠️' : type === 'success' ? '✅' : '💬';
        notifText.textContent = text;
        notificationOverlay.classList.add('show');
        notifBtn.onclick = () => notificationOverlay.classList.remove('show');
        notificationOverlay.onclick = (e) => { if (e.target === notificationOverlay) notificationOverlay.classList.remove('show'); };
    }

    // ============ API ============
    async function apiRequest(endpoint, method='GET', body=null) {
        const headers = {'Content-Type': 'application/json'};
        if (tg?.initData) headers['X-Telegram-Init-Data'] = tg.initData;
        const options = { method, headers };
        if (body) options.body = JSON.stringify(body);
        const res = await fetch(`${API_URL}${endpoint}`, options);
        return res.json();
    }

    async function fetchBalance() {
        try {
            const data = await apiRequest('/balance');
            if (data.balance !== undefined) {
                balance = data.balance;
                updateBalance();
            }
        } catch(e) {}
    }

    // ============ ПОПОЛНЕНИЕ ЧЕРЕЗ TELEGRAM STARS ============
    document.getElementById('btn-deposit').addEventListener('click', async () => {
        const amount = parseInt(document.getElementById('modal-amount-input').value);
        if (isNaN(amount) || amount <= 0) {
            showNotification('Введите корректную сумму', 'error');
            return;
        }

        try {
            // Запрашиваем invoice link с сервера
            const data = await apiRequest('/deposit', 'POST', { amount });
            
            if (data.success && data.invoiceLink) {
                // Закрываем модалку
                document.getElementById('modal-overlay').classList.remove('show');
                
                // Открываем нативный Telegram Invoice
                if (tg && tg.openInvoice) {
                    tg.openInvoice(data.invoiceLink, (status) => {
                        if (status === 'paid') {
                            showNotification('Платёж прошёл! Баланс будет начислен.', 'success');
                            setTimeout(fetchBalance, 1500);
                        } else if (status === 'cancelled') {
                            showNotification('Платёж отменён', 'error');
                        } else if (status === 'failed') {
                            showNotification('Ошибка оплаты. Проверьте баланс звёзд.', 'error');
                        }
                    });
                } else {
                    // Фолбэк для тестов
                    showNotification('Открытие оплаты недоступно. Используйте Telegram Mini App.', 'error');
                }
            } else {
                showNotification(data.error || 'Ошибка создания платежа', 'error');
            }
        } catch(e) {
            showNotification('Сервер недоступен', 'error');
        }
    });

    // Вывод
    document.getElementById('btn-withdraw').addEventListener('click', async () => {
        const amount = parseInt(document.getElementById('modal-amount-input').value);
        if (isNaN(amount) || amount <= 0) {
            showNotification('Введите корректную сумму', 'error');
            return;
        }
        if (amount < 100) {
            showNotification('Минимальный вывод 100 ⭐', 'error');
            return;
        }
        if (amount > balance) {
            showNotification('Недостаточно звезд на балансе!', 'error');
            return;
        }
        try {
            const data = await apiRequest('/withdraw', 'POST', { amount });
            if (data.success) {
                balance = data.balance;
                updateBalance();
                document.getElementById('modal-overlay').classList.remove('show');
                showNotification('Заявка на вывод отправлена', 'success');
            } else {
                showNotification(data.error || 'Ошибка вывода', 'error');
            }
        } catch(e) {
            showNotification('Сервер недоступен', 'error');
        }
    });

    // ============ ФУНКЦИИ ============
    function simulateLoading(){let p=0;const iv=setInterval(()=>{p+=12;if(p>=100){p=100;clearInterval(iv);setTimeout(()=>{loadingScreen.classList.add('hidden');app.classList.add('active');initAll();},200);}loadingFill.style.width=p+'%';},60);}
    function initAll(){
        setupGraphCanvas();
        updateProfile();
        startRollLoop();
        startCrashLoop();
        initMines();
        updateBalance();
        updateStats();
        fetchBalance();
    }
    function updateProfile() {
        const avatar = document.getElementById('profile-avatar');
        const nick = document.getElementById('profile-nick');
        if (userInfo.photoUrl) avatar.src = userInfo.photoUrl;
        else avatar.src = `https://api.dicebear.com/9.x/thumbs/svg?seed=${userInfo.id || 'player'}`;
        nick.textContent = userInfo.firstName || userInfo.username || 'Player';
    }
    function setupGraphCanvas(){const w=crashDisplay.clientWidth||280;const h=crashDisplay.clientHeight||280;graphCanvas.width=w;graphCanvas.height=h;}

    // Roll
    function startRollLoop(){resetRound();startTimer();}
    function resetRound(){
        gamePhase='waiting';timerSeconds=30;myBet=0;
        allBets.forEach(b=>releaseColor(b.color));allBets=[];usedColors=[];
        drawWheel();updateRollPlayersList();updateMyBetInfo();updateBank();
        btnPlaceBet.disabled=false;timerOverlay.textContent=timerSeconds;timerOverlay.style.display='block';
        currentPointerAngle=0;pointerLayer.style.transition='none';pointerLayer.style.transform='rotate(0deg)';
    }
    function startTimer(){if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(()=>{timerSeconds--;timerOverlay.textContent=timerSeconds;if(timerSeconds<=0){clearInterval(timerInterval);timerOverlay.style.display='none';startSpin();}},1000);}
    function getUniqueColor(){const a=uniqueColorsPool.filter(c=>!usedColors.includes(c));if(a.length===0){usedColors=[];return uniqueColorsPool[0];}const c=a[Math.floor(Math.random()*a.length)];usedColors.push(c);return c;}
    function releaseColor(c){usedColors=usedColors.filter(x=>x!==c);}
    function drawWheel(){
        ctx.clearRect(0,0,SIZE,SIZE);const cx=SIZE/2,cy=SIZE/2,rad=SIZE/2-4;
        const t=allBets.reduce((s,b)=>s+b.amount,0);
        if(t===0){ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.fillStyle='#0d0d18';ctx.fill();ctx.strokeStyle='#1a1a25';ctx.lineWidth=2;ctx.stroke();return;}
        let sa=-Math.PI/2;
        allBets.forEach(b=>{
            const sw=(b.amount/t)*Math.PI*2,ea=sa+sw;
            ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,rad,sa,ea);ctx.closePath();
            ctx.fillStyle=b.color;ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=2;ctx.stroke();
            const ma=sa+sw/2,ad=rad*0.58,ax=cx+Math.cos(ma)*ad,ay=cy+Math.sin(ma)*ad,as=64;
            ctx.fillStyle='rgba(255,255,255,0.95)';ctx.font='bold 18px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
            ctx.fillText(b.name.substring(0,10),ax,ay-10);
            ctx.fillText(b.amount+'⭐',ax,ay+10);
            sa=ea;
        });
        ctx.beginPath();ctx.arc(cx,cy,44,0,Math.PI*2);const g=ctx.createRadialGradient(cx-8,cy-8,4,cx,cy,44);
        g.addColorStop(0,'#3a3a45');g.addColorStop(1,'#0a0a0f');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#1a1a25';ctx.lineWidth=4;ctx.stroke();
    }
    function startSpin(){
        if(allBets.length===0){setTimeout(()=>{resetRound();startTimer();},600);return;}
        gamePhase='spinning';btnPlaceBet.disabled=true;
        const t=allBets.reduce((s,b)=>s+b.amount,0);
        let r=Math.random()*t,wi=0;
        for(let i=0;i<allBets.length;i++){r-=allBets[i].amount;if(r<=0){wi=i;break;}}
        let cum=0;const segs=[];
        for(const b of allBets){const sw=(b.amount/t)*360;segs.push({start:cum,sweep:sw,bet:b});cum+=sw;}
        const ts=segs[wi],ta=ts.start+Math.random()*ts.sweep,sp=6+Math.floor(Math.random()*7),tr=sp*360+ta;
        const dur=4200,sa=currentPointerAngle,st=performance.now();
        function anim(now){
            const el=now-st,pr=Math.min(el/dur,1),ea=pr<0.5?8*pr**4:1-(-2*pr+2)**4/2;
            currentPointerAngle=(sa+tr*ea)%360;
            pointerLayer.style.transition='none';pointerLayer.style.transform=`rotate(${currentPointerAngle}deg)`;
            if(pr<1)requestAnimationFrame(anim);else finishRoll(allBets[wi],t);
        }
        requestAnimationFrame(anim);
    }
    function finishRoll(w,t){
        gamePhase='result';
        if(w.isYou){balance+=t;stats.wins++;stats.won+=t;showResultBanner('🎉 Вы выиграли '+t+' ⭐!',true);}
        else showResultBanner(w.name+' выиграл '+t+' ⭐',false);
        if(myBet>0)stats.spent+=myBet;
        updateBalance();updateStats();
        setTimeout(()=>{resetRound();startTimer();},2200);
    }
    function updateRollPlayersList(){
        playersList.innerHTML='';
        if(allBets.length===0){playersList.innerHTML='<div style="text-align:center;color:#555;padding:16px;">Нет ставок</div>';return;}
        allBets.forEach(b=>{
            const r=document.createElement('div');r.className='player-row'+(b.isYou?' you':'');
            r.innerHTML=`<span><span class="player-color-dot" style="background:${b.color};"></span>${b.name}</span><span>${b.amount} ⭐</span>`;
            playersList.appendChild(r);
        });
    }
    function updateBank(){bankAmount.textContent=allBets.reduce((s,b)=>s+b.amount,0)+' ⭐';}
    function updateMyBetInfo(){myBetInfo.textContent=myBet>0?`Ваша ставка: ${myBet} ⭐`:'Ваша ставка: —';}
    btnPlaceBet.addEventListener('click',async()=>{
        if(gamePhase!=='waiting')return;
        if(myBet>0){showNotification('Вы уже поставили в этом раунде!','error');return;}
        const a=parseInt(betInput.value);
        if(isNaN(a)||a<10){showNotification('Минимальная ставка 10 ⭐','error');return;}
        if(a>balance){showNotification('Недостаточно звезд на балансе!','error');return;}
        balance-=a;myBet=a;updateBalance();
        allBets.push({id:'you',name:userInfo.firstName||'You',amount:a,color:'#c9a84c',isYou:true});
        drawWheel();updateRollPlayersList();updateBank();updateMyBetInfo();
    });

    // Crash
    function startCrashLoop(){startCrashBettingPhase();}
    function startCrashBettingPhase(){
        crashPhase='betting';crashCountdown=5;crashMyBet=0;crashMyCashedOut=false;
        crashMultiplier=1.00;crashMaxMultiplier=1.00;graphPoints=[];
        crashMultiplierEl.textContent='1.00x';crashMultiplierEl.classList.remove('crashed');
        setupGraphCanvas();clearGraph();updateCrashButton();
        betModal.classList.remove('show');
        crashMainBtn.textContent='Betting 5';
        if(crashCountdownInterval)clearInterval(crashCountdownInterval);
        crashCountdownInterval=setInterval(()=>{crashCountdown--;if(crashCountdown>0)crashMainBtn.textContent='Betting '+crashCountdown;else{clearInterval(crashCountdownInterval);startFlight();}},1000);
    }
    function clearGraph(){graphCtx.clearRect(0,0,graphCanvas.width,graphCanvas.height);}
    function drawGraph(){
        const w=graphCanvas.width,h=graphCanvas.height;
        graphCtx.clearRect(0,0,w,h);
        if(graphPoints.length<2)return;
        let lineColor=crashPhase==='crashed'?'rgba(231,76,60,0.9)':'rgba(46,204,113,0.9)';
        graphCtx.beginPath();graphCtx.lineWidth=3;graphCtx.lineCap='round';graphCtx.lineJoin='round';graphCtx.strokeStyle=lineColor;
        const padding=25,graphW=w-padding*2,graphH=h-padding*2;
        for(let i=0;i<graphPoints.length;i++){const p=graphPoints[i];const x=padding+p.x*graphW;const y=h-padding-p.y*graphH;if(i===0)graphCtx.moveTo(x,y);else graphCtx.lineTo(x,y);}
        graphCtx.stroke();
        if(graphPoints.length>0){const last=graphPoints[graphPoints.length-1];const lx=padding+last.x*graphW;const ly=h-padding-last.y*graphH;graphCtx.beginPath();graphCtx.arc(lx,ly,5,0,Math.PI*2);graphCtx.fillStyle=lineColor;graphCtx.fill();}
    }
    function startFlight(){
        crashPhase='flying';const r=Math.random();
        if(r<0.40)crashMaxMultiplier=1.01+Math.random()*0.7;
        else if(r<0.70)crashMaxMultiplier=1.2+Math.random()*1.3;
        else if(r<0.90)crashMaxMultiplier=2.0+Math.random()*2.5;
        else crashMaxMultiplier=3.5+Math.random()*6;
        crashMultiplier=1.00;graphPoints=[{x:0,y:0}];
        setupGraphCanvas();clearGraph();updateCrashButton();
        const st=performance.now(),lineDuration=6000;
        function fly(now){
            if(crashPhase!=='flying')return;
            const el=(now-st)/1000;
            crashMultiplier=Math.pow(Math.E,el*0.12);
            if(crashMultiplier>=crashMaxMultiplier){crashMultiplier=crashMaxMultiplier;crashNow();return;}
            crashMultiplierEl.textContent=crashMultiplier.toFixed(2)+'x';
            const lineProgress=Math.min(el*1000/lineDuration,1);
            graphPoints.push({x:lineProgress,y:lineProgress});
            if(graphPoints.length>200)graphPoints.shift();
            drawGraph();
            crashInterval=requestAnimationFrame(fly);
        }
        crashInterval=requestAnimationFrame(fly);
    }
    function crashNow(){
        crashPhase='crashed';if(crashInterval)cancelAnimationFrame(crashInterval);
        crashMultiplierEl.textContent=crashMultiplier.toFixed(2)+'x';crashMultiplierEl.classList.add('crashed');
        drawGraph();
        if(crashMyBet>0&&!crashMyCashedOut){stats.spent+=crashMyBet;updateStats();}
        crashMyCashedOut=true;
        crashHistory.unshift(crashMultiplier);if(crashHistory.length>15)crashHistory.pop();renderCrashHistory();
        updateCrashButton();
        setTimeout(()=>startCrashBettingPhase(),5000);
    }
    function cashOut(){
        if(crashPhase!=='flying'||crashMyBet===0||crashMyCashedOut)return;
        crashMyCashedOut=true;
        const w=Math.floor(crashMyBet*crashMultiplier);
        balance+=w;stats.wins++;stats.won+=w-crashMyBet;
        updateBalance();updateStats();
        showResultBanner('Вы забрали '+w+' ⭐ (x'+crashMultiplier.toFixed(2)+')!',true);
        updateCrashButton();
    }
    function updateCrashButton(){
        crashMainBtn.className='crash-btn';
        if(crashPhase==='betting'){
            if(crashMyBet===0){crashMainBtn.textContent='Place Bet';crashMainBtn.classList.add('place');crashMainBtn.onclick=()=>{if(crashPhase==='betting')betModal.classList.add('show');};}
            else{crashMainBtn.textContent='Waiting...';crashMainBtn.classList.add('waiting');crashMainBtn.onclick=null;}
        }else if(crashPhase==='flying'){
            if(crashMyBet>0&&!crashMyCashedOut){crashMainBtn.textContent='Cashout';crashMainBtn.classList.add('cashout');crashMainBtn.onclick=cashOut;}
            else{crashMainBtn.textContent='Waiting...';crashMainBtn.classList.add('waiting');crashMainBtn.onclick=null;}
        }else if(crashPhase==='crashed'){crashMainBtn.textContent='Crashed!';crashMainBtn.classList.add('crashed');crashMainBtn.onclick=null;}
    }
    function renderCrashHistory(){crashHistoryEl.innerHTML='';crashHistory.forEach(v=>{const i=document.createElement('div');i.className='history-item '+(v>=2?'green':'red');i.textContent=v.toFixed(2)+'x';crashHistoryEl.appendChild(i);});}
    btnConfirmBet.addEventListener('click',()=>{
        const a=parseInt(crashBetInput.value);
        if(isNaN(a)||a<10){showNotification('Минимальная ставка 10 ⭐','error');return;}
        if(a>balance){showNotification('Недостаточно звезд на балансе!','error');return;}
        if(crashPhase!=='betting'){showNotification('Ставки принимаются только до взлёта!','error');return;}
        balance-=a;crashMyBet=a;updateBalance();
        betModal.classList.remove('show');updateCrashButton();
    });
    btnCancelBet.addEventListener('click',()=>betModal.classList.remove('show'));

    // Mines
    function initMines(){resetMinesGame();}
    function resetMinesGame(){
        minesGameActive=false;minesBet=0;minesRevealed=0;minesGrid=[];minesPositions=[];
        minesMultiplierEl.textContent='1.00x';minesMultiplierEl.className='mines-multiplier';
        minesRevealedEl.textContent='0';
        minesMainBtn.textContent='Играть';minesMainBtn.className='mines-btn start';
        minesMainBtn.onclick=()=>{if(!minesGameActive){minesBetModal.classList.add('show');minesBetInput.value=10;}};
        renderMinesGrid();
    }
    function getMinesMultiplier(){
        const total=25;const mines=minesMineCount;const revealed=minesRevealed;
        if(revealed===0)return 1;
        let mult=1;
        for(let i=0;i<revealed;i++){mult*=(total-mines-i)/(total-i);}
        return parseFloat((1/mult).toFixed(2));
    }
    function renderMinesGrid(){
        minesGridEl.innerHTML='';
        for(let i=0;i<25;i++){
            const cell=document.createElement('div');cell.className='mines-cell';
            if(minesGrid[i]==='revealed'){cell.classList.add('revealed');cell.textContent='⭐';}
            else if(minesGrid[i]==='bomb'){cell.classList.add('bomb');cell.textContent='💣';}
            else if(!minesGameActive){cell.classList.add('disabled');}
            cell.dataset.index=i;cell.addEventListener('click',()=>onCellClick(i,cell));
            minesGridEl.appendChild(cell);
        }
    }
    function onCellClick(index,cell){
        if(!minesGameActive)return;
        if(minesGrid[index])return;
        if(minesPositions.includes(index)){
            minesGrid[index]='bomb';cell.classList.add('bomb');cell.textContent='💣';
            revealAllBombs();minesGameActive=false;
            stats.spent+=minesBet;updateStats();
            minesMultiplierEl.textContent='0.00x';minesMultiplierEl.className='mines-multiplier lost';
            minesMainBtn.textContent='Взрыв!';minesMainBtn.className='mines-btn over';minesMainBtn.onclick=null;
            showResultBanner('💣 Вы наткнулись на мину!',false);
            setTimeout(resetMinesGame,2000);
        }else{
            minesGrid[index]='revealed';cell.classList.add('revealed');cell.textContent='⭐';
            minesRevealed++;minesRevealedEl.textContent=minesRevealed;
            const mult=getMinesMultiplier();
            minesMultiplierEl.textContent=mult.toFixed(2)+'x';minesMultiplierEl.className='mines-multiplier';
            if(minesRevealed===25-minesMineCount){cashoutMines();}
        }
    }
    function revealAllBombs(){
        const cells=minesGridEl.children;
        minesPositions.forEach(pos=>{if(minesGrid[pos]!=='bomb'){minesGrid[pos]='bomb';cells[pos].classList.add('bomb');cells[pos].textContent='💣';}});
        for(let i=0;i<25;i++){cells[i].classList.add('disabled');}
    }
    function cashoutMines(){
        if(!minesGameActive)return;
        const mult=getMinesMultiplier();const win=Math.floor(minesBet*mult);
        balance+=win;stats.wins++;stats.won+=win-minesBet;
        updateBalance();updateStats();
        minesGameActive=false;
        minesMultiplierEl.textContent=mult.toFixed(2)+'x';minesMultiplierEl.className='mines-multiplier cashed';
        minesMainBtn.textContent='Забрано!';minesMainBtn.className='mines-btn over';minesMainBtn.onclick=null;
        for(let i=0;i<25;i++){minesGridEl.children[i].classList.add('disabled');}
        showResultBanner('⭐ Вы выиграли '+win+' ⭐ (x'+mult.toFixed(2)+')!',true);
        setTimeout(resetMinesGame,2000);
    }
    function startMinesGame(amount){
        minesMineCount=parseInt(minesCountSelect.value);
        minesBet=amount;minesRevealed=0;
        minesGrid=new Array(25).fill(null);minesPositions=[];
        while(minesPositions.length<minesMineCount){const pos=Math.floor(Math.random()*25);if(!minesPositions.includes(pos))minesPositions.push(pos);}
        minesGameActive=true;
        minesMultiplierEl.textContent='1.00x';minesMultiplierEl.className='mines-multiplier';
        minesRevealedEl.textContent='0';
        minesMainBtn.textContent='Забрать';minesMainBtn.className='mines-btn cashout';minesMainBtn.onclick=cashoutMines;
        renderMinesGrid();
    }
    minesMainBtn.addEventListener('click',()=>{if(!minesGameActive){minesBetModal.classList.add('show');minesBetInput.value=10;}});
    btnConfirmMinesBet.addEventListener('click',()=>{
        const a=parseInt(minesBetInput.value);
        if(isNaN(a)||a<10){showNotification('Минимальная ставка 10 ⭐','error');return;}
        if(a>balance){showNotification('Недостаточно звезд на балансе!','error');return;}
        balance-=a;updateBalance();
        minesBetModal.classList.remove('show');startMinesGame(a);
    });
    btnCancelMinesBet.addEventListener('click',()=>minesBetModal.classList.remove('show'));
    minesCountSelect.addEventListener('change',()=>{if(!minesGameActive){minesMineCount=parseInt(minesCountSelect.value);minesMultiplierEl.textContent='1.00x';}});

    // Common
    function showResultBanner(t,w){
        resultBanner.textContent=t;resultBanner.style.display='block';
        resultBanner.style.animation='none';resultBanner.offsetHeight;
        resultBanner.style.animation='fadeInOut 3s ease forwards';
        resultBanner.style.borderColor=w?'#c9a84c':'#555';
        setTimeout(()=>resultBanner.style.display='none',3000);
    }
    function updateBalance(){balanceDisplay.textContent=balance;modalBalance.textContent=balance;}
    function updateStats(){statWins.textContent=stats.wins;statSpent.textContent=stats.spent+' ⭐';statWon.textContent=stats.won+' ⭐';}

    document.querySelectorAll('.bottom-tab').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('.bottom-tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('tab-'+b.dataset.tab).classList.add('active');});});
    document.getElementById('btn-open-modal').addEventListener('click',()=>{document.getElementById('modal-amount-input').value=10;document.getElementById('modal-overlay').classList.add('show');});
    document.getElementById('btn-close-modal').addEventListener('click',()=>document.getElementById('modal-overlay').classList.remove('show'));

    simulateLoading();
})();
</script>
</body>
</html>
